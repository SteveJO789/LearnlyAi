name: ฟีเจอร์ใหม่
description: เพิ่มความสามารถใหม่ให้กับผลิตภัณฑ์หรือระบบ
title: "[MODULE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: เป้าหมาย
      description: ฟีเจอร์นี้ต้องการแก้ปัญหาหรือทำให้ระบบทำอะไรได้?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: ขอบเขตงาน
      description: ระบุขอบเขตของ Implementation และสิ่งที่ไม่รวมในงานนี้
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: ระบุเกณฑ์ที่ตรวจสอบได้ว่างานนี้เสร็จสมบูรณ์
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: ระบุ Issue, API, Schema หรือ Module ที่เกี่ยวข้อง
