name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  api:
    name: API CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            services/api/package-lock.json
            knowledge/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Knowledge build dependencies
        run: npm --prefix ../../knowledge ci --no-audit --no-fund

      - name: Prepare validated minimal runtime Knowledge
        run: npm run knowledge:prepare-runtime

      - name: Verify source-only runtime preparation and determinism
        run: node --test ../../knowledge/test/runtime-knowledge.test.mjs

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify fresh source export and relocated API runtime
        run: npm run knowledge:verify-fresh

      - name: Verify authenticated persisted RAG flow with offline transports
        run: npm run test:persistent
